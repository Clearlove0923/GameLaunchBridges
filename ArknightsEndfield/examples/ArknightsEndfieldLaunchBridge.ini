; Optional. Defaults work without this file. ASCII or UTF-16 LE BOM for non-ASCII values.
[Paths]
GameFileName=Endfield.exe
LauncherFileName=Launcher.exe
RuntimeFileName=Games.exe
; LauncherProductContains defaults to the official Chinese product keyword.
[Discovery]
GameCandidates=Arknights Endfield/Endfield.exe;Endfield.exe
SearchDepth=8
ExcludedDirectories=Backup;Backups;Downloads;Temp;Cache;$RECYCLE.BIN;.git;tests;tools;src;Windows;node_modules
[Launch]
LauncherArguments=--game=endfield --reason=4
GameCode=endfield
[Trigger]
UiVersionPrefix=1.6.
ClickXRatio=0.835
ClickYRatio=0.866
[LauncherWindow]
SuppressWindow=1
CloseAfterGame=1
ForceAfterTimeout=1
[Timing]
ReadyTimeoutSeconds=300
GameTimeoutSeconds=60
ExitDebounceSeconds=10
CloseTimeoutSeconds=5
PollMilliseconds=250
