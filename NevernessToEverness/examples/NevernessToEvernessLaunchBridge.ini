[Paths]
; InstallRoot may be relative to this INI. Leave empty for discovery from the bridge EXE.
InstallRoot=
LauncherFileName=NTEGame.exe
GameFileName=HTGame.exe
LauncherCandidates=NTELauncher/NTEGame.exe
GameCandidates=Client/WindowsNoEditor/HT/Binaries/Win64/HTGame.exe
LauncherLog=NTELauncher/UserData/Log/NTEGame.log

[Discovery]
SearchDepth=12
ExcludedDirectories=Backup;Backups;Download;Downloads;Temp;Tmp;Cache;Caches;Patch;BinPatch;$RECYCLE.BIN

[Launch]
DirectArguments=/launcher /directly
ReadyMarkers=_setLocalResChecked] 0->1;onGameElementUpdateFinished] all ready

[Trigger]
Mode=accessibilityThenClick
StartButtonNames=开始游戏;开始
FallbackClickXRatio=0.88
FallbackClickYRatio=0.90

[LauncherWindow]
StartHidden=1
SuppressWindow=1
CloseAfterGame=1
GracefulCloseSeconds=3
ForceTerminateAfterTimeout=1

[Timing]
ReadyTimeoutSeconds=120
GameStartupTimeoutSeconds=120
ExitDebounceSeconds=10
PollMilliseconds=250
TriggerDelayMilliseconds=500
